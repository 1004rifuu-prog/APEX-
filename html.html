<!DOCTYPE html>
<html lang="ja">
<head>

    <!-- Google Fonts から近未来的なフォントを読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --apex-red: #ff4655;
            --apex-red-hover: #ff2b3c;
            --apex-green: #00ff88;
            --apex-cyan: #00f3ff;
            --apex-gold: #ffba00;
            --bg-dark: #0a0c10;
            --card-bg: rgba(20, 24, 33, 0.85);
            --card-border: #2a3245;
            --input-bg: #141923;
            --text-main: #e6e8ec;
            --text-sub: #8c9ba5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 70, 85, 0.15), transparent 70%),
                radial-gradient(circle at 80% 80%, rgba(0, 243, 255, 0.08), transparent 50%),
                linear-gradient(rgba(10, 12, 16, 0.9), rgba(10, 12, 16, 0.9)),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 255, 255, 0.02) 2px, rgba(255, 255, 255, 0.02) 4px);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 760px;
            position: relative;
        }

        /* ヘッダーデザイン */
        header {
            text-align: center;
            margin-bottom: 35px;
            position: relative;
        }

        .title-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: var(--apex-cyan);
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
        }

        h1 {
            font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(255, 70, 85, 0.6);
            display: inline-block;
            position: relative;
            padding: 0 10px;
        }

        h1::before, h1::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30px;
            height: 3px;
            background-color: var(--apex-red);
            transform: translateY(-50%);
        }

        h1::before { left: -40px; }
        h1::after { right: -40px; }

        /* カードスタイル */
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--apex-red);
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 4px;
            position: relative;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            /* サイバー的な角削り */
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }

        .question-card:hover {
            border-color: rgba(255, 70, 85, 0.5);
            box-shadow: 0 10px 30px rgba(255, 70, 85, 0.15);
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 18px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-title::before {
            content: '>';
            font-family: 'Orbitron', sans-serif;
            color: var(--apex-green);
            font-weight: 900;
            font-size: 1.3rem;
            text-shadow: 0 0 8px var(--apex-green);
        }

        label.select-label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 6px;
            font-weight: 700;
        }

        /* セレクトボックス改修 */
        select {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%2300ff88' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
        }

        select:focus, select:hover {
            border-color: var(--apex-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        /* ラジオボタンデザイン改修 */
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 12px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            user-select: none;
        }

        .radio-label:hover {
            background: #1c2333;
            border-color: rgba(0, 243, 255, 0.4);
            transform: translateX(4px);
        }

        .radio-label input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-sub);
            border-radius: 2px;
            margin-right: 12px;
            outline: none;
            position: relative;
            transition: all 0.2s;
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        .radio-label input[type="radio"]:checked {
            border-color: var(--apex-cyan);
            background-color: var(--apex-cyan);
            box-shadow: 0 0 10px var(--apex-cyan);
        }

        .radio-label input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 8px;
            height: 8px;
            background-color: var(--bg-dark);
        }

        .radio-label:has(input[type="radio"]:checked) {
            border-color: var(--apex-cyan);
            background: rgba(0, 243, 255, 0.05);
            color: #ffffff;
            font-weight: 700;
        }

        /* ボタンデザイン */
        button.submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--apex-red), #b31220);
            color: #ffffff;
            border: none;
            padding: 18px;
            font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(255, 70, 85, 0.4);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }

        button.submit-btn:hover {
            background: linear-gradient(135deg, #ff5e6c, var(--apex-red));
            box-shadow: 0 0 30px rgba(255, 70, 85, 0.8);
            transform: translateY(-2px);
        }

        button.submit-btn:active {
            transform: translateY(1px);
        }

        /* 診断結果エリア */
        #result-area {
            display: none;
            background: var(--card-bg);
            border: 2px solid var(--apex-green);
            border-radius: 4px;
            padding: 35px 25px;
            margin-top: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            animation: fadeIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .result-header {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: var(--apex-cyan);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .result-title {
            text-align: center;
            font-size: 2.2rem;
            color: #ffffff;
            font-weight: 900;
            margin-bottom: 30px;
            text-shadow: 0 0 15px var(--apex-green);
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
            padding-bottom: 15px;
        }

        .result-item {
            margin-bottom: 22px;
            padding: 15px;
            background: rgba(10, 12, 16, 0.6);
            border-left: 3px solid var(--apex-gold);
            border-radius: 0 4px 4px 0;
        }

        .result-item-title {
            font-weight: 700;
            color: var(--apex-gold);
            margin-bottom: 8px;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .result-item-body {
            line-height: 1.6;
            color: #d1d5db;
            font-size: 0.95rem;
        }

        .retry-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 12px 30px;
            font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            display: block;
            margin: 30px auto 0;
            transition: all 0.3s;
        }

        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 600px) {
            body { padding: 20px 10px; }
            h1 { font-size: 1.6rem; }
            h1::before, h1::after { display: none; }
            .question-card { padding: 18px; }
            .result-title { font-size: 1.7rem; }
        }
    </style>
</head>

            "0": "投擲物を信用していない可哀想な人間。自分しか信用できないナルシスト傾向あり。",
            "1": "一歩引いた視野を持っているが、土壇場に弱く本番でミスをしやすい人間。",
            "2": "物事を計画通りに進めたい几帳面なタイプ。想定外のトラブルが起きるとフリーズする。",
            "3": "破壊衝動を秘めた危ない人間。ストレスが溜まると爆発するタイプ。"
        };

        // 3. アタッチメント優先順位データ (5パターン)
        const attachmentData = {
            "A": "【拡張マガジン優先】質より量。数打ちゃ当たると思っている大雑把な性格。",
            "B": "【サイト優先】形から入るタイプ。形は綺麗だが中身が伴わないことが多い。",
            "C": "【バレル/レーザー優先】ブレを極端に嫌う心配性。安心感を常に求めている。",
            "D": "【ストック優先】操作感や快適性を重視するこだわり派。譲れない持論が多い。",
            "E": "【ポップアップ優先】一発逆転やロマンを追い求めるギャンブラー性質。"
        };

        // 4. 回復アイテム持ち方データ (5パターン)
        const healData = {
            "A": "【起点役】シールドを割られすぎて被ダメだけでハンマーを狙えるタンク役。味方のために持っているという輩もいるがそれは建前。",
            "B": "【気が弱い】自分の意思を持たず流れるままに生きる浮浪者。話していると話に芯がなく会話を続ける意味がない。",
            "C": "【依存者】ギリギリの体力でフェニックスキットを使うことに快楽を覚えている危ないひと。酒癖が悪い。",
            "D": "【温室育ち】生まれながらにして環境が良くあまり苦労をしていない軟な性格。情熱がなく飽き性で無能。",
            "E": "【サバイバー】ゲームを理解していない無能。乞食初期症状に多いカス。"
        };

        function diagnose() {
            const w1 = document.getElementById("weapon1").value;
            const w2 = document.getElementById("weapon2").value;
            const grenade = document.querySelector('input[name="grenade"]:checked');
            const attachment = document.querySelector('input[name="attachment"]:checked');
            const heal = document.querySelector('input[name="heal"]:checked');

            if (!w1 || !w2 || !grenade || !attachment || !heal) {
                alert("すべての質問にお答えください！");
                return;
            }

            // 武器キーの並び順を統一（順不同対応）
            const order = ["AR", "SMG", "LMG", "MR", "SR", "SG", "PISTOL"];
            let key = "";
            if (order.indexOf(w1) <= order.indexOf(w2)) {
                key = `${w1}-${w2}`;
            } else {
                key = `${w2}-${w1}`;
            }

            const wResult = weaponData[key];
            
            // 画面反映
            document.getElementById("res-title").innerText = `『${wResult.title}』`;
            document.getElementById("res-weapon").innerText = wResult.text;
            document.getElementById("res-grenade").innerText = grenadeData[grenade.value];
            document.getElementById("res-attachment").innerText = attachmentData[attachment.value];
            document.getElementById("res-heal").innerText = healData[heal.value];

            // フォームを非表示にして結果を表示
            document.getElementById("diagnosis-form").style.display = "none";
            document.getElementById("result-area").style.display = "block";
            
            // 結果エリアへスクロール
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
